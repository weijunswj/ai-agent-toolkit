# Toolkit Programme Sweep: the programme refresh, run on GitHub instead of a computer.
#
# After every push to main (a merged pull request), when started by hand, and when the gate
# workflow (toolkit-programme-sweep-gate.yml) starts it, it refreshes the programme board of this
# repository: it reads what changed on GitHub, saves the programme state and redraws the parent and
# task pages. The gate runs hourly and on issue, comment and pull request activity with only the
# built-in token, and starts this workflow on main only when there is work, so a quiet hour costs
# seconds.
# It runs `programme.cjs refresh` from the commit it checked out, under the governance GitHub App:
# two installation tokens, one for this repository (issues, pull requests, checks) and one for the
# evidence store (contents), each minted with only its own permissions. The built-in token is
# contents read only, the checkout keeps no credentials, and no token or key is printed.
#
# With no App configured it ends with a notice and writes nothing. A repository whose state lives
# on a public branch is skipped with a notice too. Runs never overlap: one at a time, none
# cancelled, and the sweep's lease in the evidence store keeps it from writing while the
# computer's sweep is running. A pass works for up to 50 minutes, is killed at 55 and the job is
# stopped at 58, so it ends before the next hourly start; the next run reports a stopped one. It has
# no request cap of its own: it reads until the App's remaining hourly count reaches the safety
# margin, saves where it got to and the next run resumes. Each governed repository has its own App,
# so its own hourly allowance. A pass that stops early after reading something starts one follow-up
# run itself: once GitHub's hourly App limit has reset (an hour and a minute after the pass began),
# or at once after its own time limit, so a backlog keeps draining when GitHub drops an hourly start.
# The follow-up job holds only the built-in token, allowed to start workflow runs.
#
# After the refresh it cleans the "Generated by Claude Code" footer the cloud GitHub route adds, from
# posts the repository owner wrote in this repository and its evidence store in the last 26 hours
# (or since the time a manual run gives), and writes only counts to the summary.
#
# The run after each merge keeps the board current even when GitHub drops an hourly start. It runs
# only for pushes to main, never for pull requests or forks, so the App's secrets reach only code
# already merged; the gate and the follow-up start it on main.
name: Toolkit Programme Sweep

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      footer_since:
        description: 'Clean footers from posts changed since this ISO time (default: the last 26 hours)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sweep:
    name: Refresh the programme
    runs-on: ubuntu-latest
    timeout-minutes: 58
    # One sweep at a time, with one waiting; a newer start replaces the waiting one. The follow-up
    # job sits outside the group, so its wait never holds back the run after a merge.
    concurrency:
      group: toolkit-programme-sweep-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      follow_up_at: ${{ steps.refresh.outputs.follow_up_at }}
    steps:
      - name: Check out this run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read the evidence store from the binding
        id: binding
        run: node repo/scripts/toolkit-programme-sweep-action.cjs store

      - name: Mint the governed repository token
        id: governed
        if: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID != '' && steps.binding.outputs.store != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOOLKIT_GOVERNANCE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
          permission-contents: read
          permission-checks: read
          permission-statuses: read

      - name: Mint the evidence store token
        id: store
        if: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID != '' && steps.binding.outputs.store != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOOLKIT_GOVERNANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.binding.outputs.store }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Refresh the programme
        id: refresh
        env:
          STORE_REPOSITORY: ${{ steps.binding.outputs.store_repository }}
          APP_CLIENT_ID_SET: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID != '' }}
          MINT_OUTCOME: ${{ steps.governed.outcome }}/${{ steps.store.outcome }}
          GOVERNED_TOKEN: ${{ steps.governed.outputs.token }}
          STORE_TOKEN: ${{ steps.store.outputs.token }}
          SWEEP_LOGIN: ${{ steps.governed.outputs.app-slug }}[bot]
        run: node repo/scripts/toolkit-programme-sweep-action.cjs refresh

      - name: Clean the cloud footer from the owner's posts
        if: ${{ !cancelled() && steps.governed.outcome == 'success' && steps.store.outcome == 'success' }}
        env:
          STORE_REPOSITORY: ${{ steps.binding.outputs.store_repository }}
          GOVERNED_TOKEN: ${{ steps.governed.outputs.token }}
          STORE_TOKEN: ${{ steps.store.outputs.token }}
          FOOTER_SINCE: ${{ inputs.footer_since }}
        run: node repo/scripts/toolkit-programme-sweep-action.cjs footers

  follow-up:
    name: Start the next run after an early stop
    needs: sweep
    if: ${{ needs.sweep.outputs.follow_up_at != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: write
    steps:
      - name: Check out the follow-up script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: repo/scripts/toolkit-programme-sweep-gate.cjs
          sparse-checkout-cone-mode: false

      - name: Wait for the limit to reset, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOW_UP_AT: ${{ needs.sweep.outputs.follow_up_at }}
        run: node repo/scripts/toolkit-programme-sweep-gate.cjs follow-up
