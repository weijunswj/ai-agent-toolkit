# Toolkit Shard Timings: the test shard timing refresh, run on GitHub instead of a computer.
#
# Once a day (and when started by hand) it reads the per-file test times from the latest green
# Validate run on main and, when the shards have drifted, opens one pull request that updates the
# shard manifest. While an earlier refresh pull request is open it opens no second one. It makes no
# model calls.
#
# A push to main also starts it, as a catch-all in case the daily schedule stops firing. A push run
# first checks, in a few seconds and with no checkout, whether a refresh already ran in the last 24
# hours, and skips the refresh when one did. Only one run goes at a time.
#
# The built-in token only reads: contents, Actions runs and their artifacts, and pull requests. The
# governance GitHub App's token, minted for this repository with only contents and pull requests
# write, is used for the push and the pull request alone, so the pull request's own checks start.
# The checkout keeps no credentials and no token or key is printed. With no App configured the run
# only reports what it would change, and fails when a refresh is due (it cannot publish one); a
# configured App that cannot sign in fails the run. A refresh pull request left open over 7 days
# fails the run naming it, so it is merged or closed instead of blocking every later refresh. It never
# runs for pull requests, forks or other branches.
name: Toolkit Shard Timings

on:
  schedule:
    - cron: '37 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-shard-timings-${{ github.repository }}
  cancel-in-progress: false

jobs:
  due:
    name: Check whether a refresh is due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Check for a refresh in the last 24 hours
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "push" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api -X GET "repos/${REPO}/actions/workflows/toolkit-shard-timings.yml/runs" -f status=success -f created=">=${since}" -f per_page=30 --jq '.workflow_runs[].id')
          for id in $runs; do
            [ "$id" = "$RUN_ID" ] && continue
            refreshed=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" --jq '[.jobs[] | select(.name == "Refresh the shard timings" and .conclusion == "success")] | length')
            if [ "$refreshed" -gt 0 ]; then
              echo "::notice::A refresh already ran in the last 24 hours (run ${id}), so this push skips it."
              echo "due=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "due=true" >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh the shard timings
    needs: due
    if: ${{ needs.due.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out this run's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Mint the publish token
        id: app
        if: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TOOLKIT_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOOLKIT_GOVERNANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Refresh the shard timings
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLKIT_SHARD_PUBLISH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          MINT_OUTCOME: ${{ steps.app.outcome }}
        run: |
          if [ "$MINT_OUTCOME" = "failure" ]; then
            echo "::error::The governance GitHub App could not sign in, so no pull request was opened. Check the TOOLKIT_GOVERNANCE_APP_CLIENT_ID variable, the TOOLKIT_GOVERNANCE_APP_PRIVATE_KEY secret and that the App is installed on this repository."
            exit 1
          fi
          if [ -z "$TOOLKIT_SHARD_PUBLISH_TOKEN" ]; then
            echo "::notice::No governance App is configured, so this run only reports what it would change; it fails when a refresh is due."
            node repo/scripts/refresh-shard-timings.cjs --fail-if-due
            exit $?
          fi
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOOLKIT_SHARD_PUBLISH_TOKEN" | base64 -w0)"
          bot_id=$(GH_TOKEN="$TOOLKIT_SHARD_PUBLISH_TOKEN" gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          node repo/scripts/refresh-shard-timings.cjs --open-pr
