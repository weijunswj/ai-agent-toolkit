name: Auto-sync generated surfaces

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "_projects/**"
      - "skills/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number for a read-only Stage A rehearsal
        required: true
        type: string
      head_sha:
        description: Exact forty-character pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-sync-generated-surfaces-stage-a
  cancel-in-progress: false

env:
  ROLLOUT_STAGE: "A"
  WRITEBACK_ENABLED: "false"
  GENERAL_ENABLED: "false"
  CAPTURE_NODE_TOOLCHAIN_SHA256: ecffc9c42136167ef5edc72b01c8e340f9ca0ef304285551a8b128f624bd5c55
  VERIFY_CLOSURE_MANIFEST_SHA256: 17cefd9ce987a533a1f25da1330a4763c386eaf44d7bbc2656ef8e6986ae241f
jobs:
  auto-sync-generated-surfaces:
    name: Stage A read-only generated-surface proposal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base revision
        id: checkout_trusted_base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Set up trusted Node runtime
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Bootstrap trusted helper bytes
        working-directory: ${{ github.workspace }}/trusted
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          capture_line=$(/usr/bin/sha256sum --binary -- repo/scripts/trusted-workflows/capture-node-toolchain.cjs)
          verifier_line=$(/usr/bin/sha256sum --binary -- repo/scripts/trusted-workflows/verify-closure-manifest.cjs)
          test "$capture_line" = "$CAPTURE_NODE_TOOLCHAIN_SHA256 *repo/scripts/trusted-workflows/capture-node-toolchain.cjs"
          test "$verifier_line" = "$VERIFY_CLOSURE_MANIFEST_SHA256 *repo/scripts/trusted-workflows/verify-closure-manifest.cjs"

      - name: Capture setup-node executable identity
        working-directory: ${{ github.workspace }}/trusted
        timeout-minutes: 1
        run: node repo/scripts/trusted-workflows/capture-node-toolchain.cjs 1

      - name: Verify trusted execution closure
        working-directory: ${{ github.workspace }}/trusted
        timeout-minutes: 1
        run: node repo/scripts/trusted-workflows/verify-closure-manifest.cjs repo/scripts/trusted-workflows/verify-closure-manifest.cjs

      - name: Preflight guard
        id: preflight
        working-directory: ${{ github.workspace }}/trusted
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_ID: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: node repo/scripts/trusted-workflows/verify-closure-manifest.cjs repo/scripts/trusted-workflows/auto-sync/preflight.cjs "[\"$EVENT_NAME\",\"$REPOSITORY_ID\",\"$BASE_REF\",\"$PR_NUMBER\"]"

      - name: Verify manual rehearsal pull request
        id: verify_rehearsal_pr
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ github.workspace }}/trusted
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          REQUESTED_PR: ${{ inputs.pull_request }}
          REQUESTED_HEAD: ${{ inputs.head_sha }}
        run: node repo/scripts/trusted-workflows/verify-closure-manifest.cjs repo/scripts/trusted-workflows/auto-sync/verify-rehearsal-pr.cjs "[\"initial\",\"$EXPECTED_REPOSITORY_ID\",\"$EXPECTED_REPOSITORY\",\"$REQUESTED_PR\",\"$REQUESTED_HEAD\"]"

      - name: Checkout PR head commit
        id: checkout_pr_data
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.verify_rehearsal_pr.outputs.head_sha }}
          persist-credentials: false
          path: pr

      - name: Emit deterministic dry-run proposal
        working-directory: ${{ github.workspace }}/trusted
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || steps.verify_rehearsal_pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.verify_rehearsal_pr.outputs.head_sha }}
          PR_ROOT: ${{ github.workspace }}/pr
        run: node repo/scripts/trusted-workflows/verify-closure-manifest.cjs repo/scripts/trusted-workflows/auto-sync/dry-run.cjs "[\"$PR_NUMBER\",\"$HEAD_SHA\",\"$EVENT_NAME\",\"$PR_ROOT\"]"

      - name: Revalidate manual rehearsal pull request
        id: revalidate_rehearsal_pr
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ github.workspace }}/trusted
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          EXPECTED_REPOSITORY_ID: ${{ steps.verify_rehearsal_pr.outputs.repository_id }}
          EXPECTED_REPOSITORY: ${{ steps.verify_rehearsal_pr.outputs.repository }}
          VERIFIED_PR: ${{ steps.verify_rehearsal_pr.outputs.pr_number }}
          VERIFIED_HEAD: ${{ steps.verify_rehearsal_pr.outputs.head_sha }}
        run: node repo/scripts/trusted-workflows/verify-closure-manifest.cjs repo/scripts/trusted-workflows/auto-sync/verify-rehearsal-pr.cjs "[\"revalidate\",\"$EXPECTED_REPOSITORY_ID\",\"$EXPECTED_REPOSITORY\",\"$VERIFIED_PR\",\"$VERIFIED_HEAD\"]"

      - name: Commit generated surfaces
        if: ${{ false }}
        run: node repo/scripts/trusted-workflows/auto-sync/commit-push.cjs

      - name: Push generated surfaces
        if: ${{ false }}
        run: node repo/scripts/trusted-workflows/auto-sync/commit-push.cjs
