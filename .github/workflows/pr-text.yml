name: PR text

# Re-runs the personal-data guard when a pull request's title or body is edited, which the
# Validate workflow does not do (it runs on new commits only). The guard's ci mode checks the
# title and body for email addresses, phone numbers, WhatsApp links, real home-folder paths and AI
# attribution, and checks the pull request's commits again; the base commit's config applies.
# Values are never printed. This is a separate workflow so an edit never re-runs or skips the
# Validate jobs on the same commit.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the pull request text
        run: node skills/secure-ci-cd/scripts/personal-data-guard.cjs ci
