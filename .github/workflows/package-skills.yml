name: Package skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check packaging inputs
        run: node repo/scripts/package-skills.cjs --check

      - name: Build skill artifacts
        if: github.event_name != 'pull_request'
        run: node repo/scripts/package-skills.cjs

      - name: Generate checksums
        if: github.event_name != 'pull_request'
        run: node repo/scripts/write-package-checksums.cjs skills

      - name: Upload skill artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: skill-artifacts
          path: _dist/
