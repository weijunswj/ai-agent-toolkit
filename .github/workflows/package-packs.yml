name: Package packs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-packs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check pack inputs
        run: node repo/scripts/package-packs.cjs --check

      - name: Build pack artifacts
        if: github.event_name != 'pull_request'
        run: node repo/scripts/package-packs.cjs

      - name: Generate checksums
        if: github.event_name != 'pull_request'
        run: node repo/scripts/write-package-checksums.cjs packs

      - name: Upload pack artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pack-artifacts
          path: _dist/
