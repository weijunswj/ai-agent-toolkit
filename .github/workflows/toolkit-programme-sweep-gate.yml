# Toolkit Programme Sweep Gate: starts the cloud sweep only when there is work.
#
# It runs every hour at minute 41 (away from the top of the hour, when GitHub delays and drops
# scheduled runs most), when a person opens, edits, closes or reopens an issue, adds a comment, or
# opens, updates, closes or reopens a pull request into main, when the repository's CI workflow
# finishes, where the gate follows one (Validate in the Toolkit; a CI result changes no issue's
# update time), and when started by hand. It reads a few small GitHub answers with the built-in token
# and either ends in seconds or starts the sweep workflow (toolkit-programme-sweep.yml) on main. It
# starts it when no sweep has finished yet, when the board says the last pass left a saved place
# (once GitHub's hourly App limit has reset, if that is what stopped it), when an issue or pull
# request changed since the last successful sweep finished (or a CI run finished, where the gate
# follows a CI workflow), or when six hours have passed. A green run that made no pass (queued behind
# another sweep's lease, main moved, off the default branch) is not a sweep here; one paused at
# GitHub's hourly App limit still is, so its reset wait holds. A start from activity waits until an hour
# after the last sweep; the hourly start then picks the change up. Activity during a running sweep
# queues one more behind it. Nothing starts while a sweep is already queued.
#
# Activity from bots, the sweep's own App included, is ignored before a runner starts, so the
# sweep's own page edits never start it again. The gate checks out only the Toolkit's gate script
# (from main in the Toolkit; a governed repository's copy takes it from the pinned Toolkit commit),
# reads the binding merged on main, never holds the App's key or tokens, and its built-in token can only read
# issues, contents and check annotations and read and start workflow runs. On the hourly start and a
# start by hand it reads the titled warnings of the last runs: three sweeps in a row held, or skipped
# for the same reason, or three hourly gates in a row skipped because governance is off, turn the run
# red with the step that clears it. Activity runs never go red for this. One gate runs at a time, with one waiting;
# a newer one replaces the waiting one. `pull_request_target` and `workflow_run` run main's copy of
# this file, and nothing from the pull request or the CI run is checked out or run. A GitHub blip (a
# 5xx, a 429 or a dropped connection) ends the run green with a notice; the next start retries.
name: Toolkit Programme Sweep Gate

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed, reopened]
    branches: [main]
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: toolkit-programme-sweep-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: Start the sweep if there is work
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.sender.type != 'Bot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
    steps:
      - name: Check out the gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: repo/scripts/toolkit-programme-sweep-gate.cjs
          sparse-checkout-cone-mode: false

      - name: Start the sweep if there is work
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_WORKFLOW: validate.yml
        run: node repo/scripts/toolkit-programme-sweep-gate.cjs
