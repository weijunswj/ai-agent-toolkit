name: R4c test timing measurement

# Temporary G0 measurement for release R4c (CI speed). Not a gate: run 2 prints the slowest tests in
# the slowest files on both systems, and the failure diagnostics of the files that fail on Windows.
# Removed before R4c merges.

on:
  push:
    branches:
      - claude/project-thread-5370ug

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Tool versions
        run: |
          git --version
          git config --global --list
          python --version
          python3 --version
          pwsh --version

      - name: Slowest tests
        run: node .github/r4c-measure/measure.cjs --detail validate-toolkit.test.cjs,hostinger-coolify-production-guide.test.cjs,toolkit-local-bridge.test.cjs,update-source-watch-review-branch.test.cjs,toolkit-setup-orchestrator-1.test.cjs,toolkit-setup-managed-question-bank-protocol.test.cjs,toolkit-setup-orchestrator-2.test.cjs,n8n-workflow-transport.test.cjs

      - name: Windows failure diagnostics
        if: runner.os == 'Windows'
        run: node .github/r4c-measure/measure.cjs --detail repo-backup-ignore-hygiene.test.cjs,codex-delegation-config.test.cjs,codex-delegation-v2.test.cjs,codex-delegation-malformed-repair.test.cjs,codex-delegation-review-regression.test.cjs,n8n-portable-import.test.cjs,toolkit-local-bridge-claude-install.test.cjs,toolkit-setup-malformed-repair.test.cjs,codex-session-start-launcher.test.cjs,n8n-launcher-runtime.test.cjs,toolkit-v3-current-procedure-consistency.test.cjs,controller-bootstrap.test.cjs
