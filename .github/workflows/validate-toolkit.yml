name: Validate toolkit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check validator syntax
        run: node --check repo/scripts/validate-toolkit.cjs

      - name: Validate toolkit
        run: npm run validate:toolkit

      - name: Validate published surfaces
        run: npm run validate:surfaces

      - name: Audit fallback risk
        run: npm run validate:fallback-risk

      - name: Check whitespace
        run: npm run validate:whitespace
