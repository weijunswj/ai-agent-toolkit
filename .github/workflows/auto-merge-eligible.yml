name: Auto-merge eligibility

# Task auto-merge eligibility: fails a pull request on the always-manual list (merge rules, hooks
# and the modules they load, setup that writes hook config, CI, agent instructions, a major version
# bump; repo/scripts/toolkit-auto-merge-eligible.cjs). Where the owner turned task auto-merge on,
# the programme binding and the default branch's rules require this check too, so such a pull
# request merges only once the owner adds the toolkit-owner-merge label in GitHub, which passes the
# check for the head it was added on. A new push removes the label again, so the owner's OK never
# covers commits they have not seen. It is not part of validate, so those pull requests still pass
# the main gate.
#
# pull_request_target runs this file and the eligibility script as they are on the default branch,
# never the pull request's copies, so a pull request cannot loosen its own check. Only the default
# branch is checked out; the pull request's commits are fetched as objects and read as data by git,
# none of its files are checked out or run, and the token is never kept in the checkout. Its only
# write is removing that one label after a push.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: auto-merge-eligible-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge-eligible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check task auto-merge eligibility
        env:
          ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet origin "$HEAD_SHA" "$BASE_SHA"
          owner=""
          if printf '%s' "$LABELS" | grep -q '"toolkit-owner-merge"'; then
            if [ "$ACTION" = "synchronize" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/$NUMBER/labels/toolkit-owner-merge" > /dev/null
              echo "A new push removed the toolkit-owner-merge label; the owner adds it again for this head."
            else
              owner="--owner-merge"
            fi
          fi
          node repo/scripts/toolkit-auto-merge-eligible.cjs --base "$BASE_SHA" --head "$HEAD_SHA" $owner
