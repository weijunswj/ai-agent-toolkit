name: Auto-merge eligibility

# Task auto-merge eligibility: fails a pull request on the always-manual list (merge rules, hooks
# and the modules they load, setup that writes hook config, CI, agent instructions, a major version
# bump; repo/scripts/toolkit-auto-merge-eligible.cjs). Where the owner turned task auto-merge on,
# the programme binding and the default branch's rules require this check too, so such a pull
# request merges only once the owner adds the toolkit-owner-merge label in GitHub. It is not part
# of validate, so those pull requests still pass the main gate. While the default branch's binding
# does not turn task auto-merge on, nothing merges without the owner anyway, so the check passes and
# only lists what would be always manual.
#
# The label counts only when the repository owner's own user account adds it (the event's sender;
# a bot, an app or anyone else adding it has it removed and fails), and only for the head it was
# added on: the run for that labeled event records a toolkit-owner-merge commit status on that
# head with this workflow's own token, and every other run passes only while the head carries that status from github-actions[bot]. A push, or a label
# without the status on the current head (whichever runs were cancelled before), removes the label
# and fails, so the owner's OK never covers commits they have not seen. Pushes run in their own
# group that nothing cancels.
#
# pull_request_target runs this file and the eligibility script as they are on the default branch,
# never the pull request's copies, so a pull request cannot loosen its own check. Only the default
# branch is checked out; the pull request's commits are fetched as objects and read as data by git,
# none of its files are checked out or run, and the token is never kept in the checkout. Its only
# writes are that label's removal and that commit status.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: auto-merge-eligible-${{ github.event.pull_request.number }}-${{ github.event.action == 'synchronize' && 'push' || 'other' }}
  cancel-in-progress: ${{ github.event.action != 'synchronize' }}

jobs:
  auto-merge-eligible:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check task auto-merge eligibility
        env:
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          OWNER: ${{ github.repository_owner }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --quiet origin "$HEAD_SHA" "$BASE_SHA"
          STATUSES="$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/statuses" --jq '.[] | {context, state, creator: .creator.login}' | jq -s -c .)"
          decision="$(STATUSES="$STATUSES" node repo/scripts/toolkit-auto-merge-eligible.cjs --label-decision)"
          echo "Owner label: $decision"
          owner=""
          case "$decision" in *record=1*)
            gh api -X POST "repos/$GH_REPO/statuses/$HEAD_SHA" -f state=success -f context=toolkit-owner-merge -f description="The owner's toolkit-owner-merge label, added on this head" > /dev/null ;;
          esac
          case "$decision" in *remove=1*)
            gh api -X DELETE "repos/$GH_REPO/issues/$NUMBER/labels/toolkit-owner-merge" > /dev/null || true
            case "$decision" in
              *not_owner=1*) echo "The toolkit-owner-merge label was added by $SENDER ($SENDER_TYPE), not by the repository owner's own account, so it was removed and does not count." ;;
              *) echo "The toolkit-owner-merge label did not belong to this head, so it was removed; the owner adds it again once they have seen it." ;;
            esac ;;
          esac
          case "$decision" in *owner_merge=1*) owner="--owner-merge" ;; esac
          node repo/scripts/toolkit-auto-merge-eligible.cjs --base "$BASE_SHA" --head "$HEAD_SHA" --binding-at "$(git rev-parse HEAD)" $owner
