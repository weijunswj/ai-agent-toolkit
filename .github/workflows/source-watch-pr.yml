name: Source Watch PR Notifier

# Scheduled only: this workflow is intentionally not manually dispatchable
# because it has contents: write and pull-requests: write permissions.
on:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-watch-pr-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Assert trusted main checkout
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Validate source locks
        run: node repo/scripts/audit-project-source-locks.cjs

      - name: Check active third-party source updates
        id: source_updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT_TEMP="$RUNNER_TEMP/active-third-party-updates.md"
          node repo/scripts/check-project-source-updates.cjs --report "$REPORT_TEMP"
          if [ -f "$REPORT_TEMP" ]; then
            echo "pr_needed=true" >> "$GITHUB_OUTPUT"
            echo "report_temp=$REPORT_TEMP" >> "$GITHUB_OUTPUT"
          else
            echo "pr_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update review notification branch
        id: update_branch
        if: steps.source_updates.outputs.pr_needed == 'true'
        env:
          BRANCH: source-watch/review-active-third-party-updates
          GH_TOKEN: ${{ github.token }}
          REPORT_TEMP: ${{ steps.source_updates.outputs.report_temp }}
          REPORT_PATH: repo/source-watch/reviews/active-third-party-updates.md
        run: |
          set -euo pipefail
          test -f "$REPORT_TEMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha="$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')"
          git switch -C "$BRANCH" origin/main
          mkdir -p "$(dirname "$REPORT_PATH")"
          if [ -L "$REPORT_PATH" ]; then
            echo "Refusing to overwrite symlink report path: $REPORT_PATH" >&2
            exit 1
          fi
          install -m 0644 "$REPORT_TEMP" "$REPORT_PATH"
          if [ ! -f "$REPORT_PATH" ] || [ -L "$REPORT_PATH" ]; then
            echo "Report path is not a regular file: $REPORT_PATH" >&2
            exit 1
          fi
          git add -- "$REPORT_PATH"
          staged_files="$(git diff --cached --name-only)"
          if [ "$staged_files" != "$REPORT_PATH" ]; then
            echo "Refusing to stage unexpected files:" >&2
            printf '%s\n' "$staged_files" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update active third-party source review report"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Plan exact review notification PR lifecycle
        id: plan_pr
        if: steps.source_updates.outputs.pr_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: source-watch/review-active-third-party-updates
          BASE_BRANCH: main
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          PR_METADATA="$RUNNER_TEMP/source-watch-pr-metadata.json"
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --limit 1000 \
            --json number,state,headRefName,baseRefName,headRepositoryOwner,headRepository,isCrossRepository \
            > "$PR_METADATA"
          node repo/scripts/plan-source-watch-pr-lifecycle.cjs \
            --mode plan \
            --input "$PR_METADATA" \
            --repository "$GITHUB_REPOSITORY" \
            --owner "$EXPECTED_OWNER" \
            --head "$BRANCH" \
            --base "$BASE_BRANCH" \
            --actionable true \
            --github-output "$GITHUB_OUTPUT"

      - name: Apply exact review notification PR lifecycle
        if: steps.source_updates.outputs.pr_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: source-watch/review-active-third-party-updates
          BASE_BRANCH: main
          EXPECTED_OWNER: ${{ github.repository_owner }}
          ACTION: ${{ steps.plan_pr.outputs.action }}
          PR_NUMBER: ${{ steps.plan_pr.outputs.pr_number }}
          CONFLICTING_PR_NUMBERS: ${{ steps.plan_pr.outputs.conflicting_pr_numbers }}
          PR_TITLE: "[source-watch] Review active source-watch updates"
          PR_BODY: ${{ runner.temp }}/source-watch-pr-body.md
        run: |
          set -euo pipefail
          query_exact_prs() {
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --limit 1000 \
              --json number,state,headRefName,baseRefName,headRepositoryOwner,headRepository,isCrossRepository
          }
          verify_open() {
            local expected_number="${1:-}"
            local metadata="$RUNNER_TEMP/source-watch-pr-verify.json"
            query_exact_prs > "$metadata"
            local args=(
              --mode verify-open
              --input "$metadata"
              --repository "$GITHUB_REPOSITORY"
              --owner "$EXPECTED_OWNER"
              --head "$BRANCH"
              --base "$BASE_BRANCH"
              --actionable true
            )
            if [ -n "$expected_number" ]; then
              args+=(--expected-number "$expected_number")
            fi
            node repo/scripts/plan-source-watch-pr-lifecycle.cjs "${args[@]}"
          }
          verify_fresh_plan() {
            local expected_action="$1"
            local expected_number="${2:-}"
            local metadata="$RUNNER_TEMP/source-watch-pr-fresh-plan.json"
            query_exact_prs > "$metadata"
            local args=(
              --mode verify-plan
              --input "$metadata"
              --repository "$GITHUB_REPOSITORY"
              --owner "$EXPECTED_OWNER"
              --head "$BRANCH"
              --base "$BASE_BRANCH"
              --actionable true
              --expected-action "$expected_action"
            )
            if [ -n "$expected_number" ]; then
              args+=(--expected-number "$expected_number")
            fi
            node repo/scripts/plan-source-watch-pr-lifecycle.cjs "${args[@]}"
          }

          cat > "$PR_BODY" <<'EOF'
          This PR is a review notification only.
          No source files or advisory tracking documents were updated.
          No SOURCE-LOCK pins or advisory baselines were changed.
          No SOURCE-LOCK pins were changed.
          No toolkit rules, skills, hooks, memory guidance, repo-map guidance, or cleanup guidance were modified or deleted.
          No upstream code was executed.
          No auto-merge is allowed.
          A human must review upstream changes, attribution/licence impact, allowlist scope, advisory recommendations, and host-harness drift evidence, then ask an AI agent to inspect before any real edits happen.
          Advisory actions, when present, are read from `repo/source-watch/advisory-targets.json`.
          No advisory tracking document was changed by this workflow.
          Security-tool release, asset, checksum, licence, publisher, maintenance and database/ref evidence is read from `skills/repository-security-gate/config/tool-lock.json`.
          Source or metadata failure is UNVERIFIED and cannot become no change.
          Candidate execution belongs only to the separate manual quarantined workflow.
          If advisory action is taken, update the advisory document in a separate human-reviewed PR.
          If meaningful host-harness drift is found, open a separate PR with evidence, rationale, exact proposed modifications, and validation.

          - [ ] Review upstream diff manually.
          - [ ] Confirm changed files are within allowlist.
          - [ ] Confirm attribution/licence notes still apply.
          - [ ] Confirm no upstream code was executed.
          - [ ] Decide whether a separate update PR should copy/adapt files.
          - [ ] For Host Harness Capability Drift Review, classify affected toolkit components using the linked template before proposing changes.
          - [ ] Confirm any shrink, move, host-native, or delete recommendation is implemented only in a separate evidence-backed PR.
          - [ ] If advisory action is taken, update the advisory document in a separate human-reviewed PR.
          - [ ] Run npm run validate:all before any real source update merge.
          EOF

          case "$ACTION" in
            fail-ambiguous-open)
              echo "Refusing source-watch PR mutation: multiple exact matching open PRs: $CONFLICTING_PR_NUMBERS" >&2
              exit 1
              ;;
            update-open)
              test -n "$PR_NUMBER"
              verify_fresh_plan update-open "$PR_NUMBER"
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body-file "$PR_BODY" --add-assignee "$EXPECTED_OWNER"
              verify_open "$PR_NUMBER"
              ;;
            create)
              verify_fresh_plan create
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base "$BASE_BRANCH" \
                --head "$BRANCH" \
                --assignee "$EXPECTED_OWNER" \
                --title "$PR_TITLE" \
                --body-file "$PR_BODY"
              verify_open
              ;;
            none)
              echo "No actionable source-watch finding; no PR lifecycle mutation."
              ;;
            *)
              echo "Refusing unknown source-watch PR lifecycle action: $ACTION" >&2
              exit 1
              ;;
          esac
