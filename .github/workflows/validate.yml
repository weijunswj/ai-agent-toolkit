name: Validate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

# A newer run for the same pull request cancels the older one; every push keeps its own run.
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The test files run in shards on Linux and Windows (repo/contracts/ci/test-shards.json). The
# validate job runs after every shard, also when one failed: its "Run validation" step runs the
# repository checks, fails any test file over its time budget (check-test-durations.cjs), and then
# proves from the shard summaries that each system ran every test file once with no failure. A
# failed, cancelled or skipped shard fails it. The tests-clock-ahead job runs the test files that
# pin a calendar date with Node's clock 400 days ahead, so a test that only passes near the date
# it pins fails now rather than months later; validate waits for it. The personal-data job checks
# every commit of the pull request or push, the commit messages, the branch name and the pull
# request title and body for email addresses, phone numbers and WhatsApp links, and the title and
# body for home-folder paths and AI attribution (values are never printed); validate waits for it
# too, so a hit or a scan error fails the required check. An edit to the title or body runs the
# whole workflow again, so a fixed body clears the required check without a new commit.
jobs:
  tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [linux-1, linux-2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run test shard
        run: node repo/scripts/run-tests.cjs --shard ${{ matrix.shard }} --os linux --temp-root "${{ runner.temp }}/tests" --summary "${{ runner.temp }}/summary/test-summary-${{ matrix.shard }}.json"

      - name: Upload test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/summary/test-summary-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [windows-1, windows-2, windows-3, windows-4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run test shard
        run: node repo/scripts/run-tests.cjs --shard ${{ matrix.shard }} --os windows --temp-root "${{ runner.temp }}/tests" --summary "${{ runner.temp }}/summary/test-summary-${{ matrix.shard }}.json"

      - name: Upload test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-summary-${{ matrix.shard }}
          path: ${{ runner.temp }}/summary/test-summary-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  tests-clock-ahead:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run the tests that pin a date with the clock 400 days ahead
        run: node repo/scripts/run-tests.cjs --clock-ahead --clock-offset-days 400 --temp-root "${{ runner.temp }}/tests"

  personal-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check for personal data
        run: node skills/secure-ci-cd/scripts/personal-data-guard.cjs ci

  validate:
    needs: [tests-linux, tests-windows, tests-clock-ahead, personal-data]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download test summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-summary-*
          path: ${{ runner.temp }}/test-summaries
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The one gate list: `npm run validate:all` runs these same commands (repo/scripts/run-validation-gate.cjs),
      # except that locally the last command runs every test file instead of checking the shard summaries.
      - name: Run validation
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_LEGS: ${{ toJSON(needs) }}
        run: |
          node repo/scripts/sync-repo-doc-contract.cjs --check
          node repo/scripts/sync-agent-instruction-shims.cjs --check
          node repo/scripts/audit-project-source-locks.cjs
          node repo/scripts/audit-published-surfaces.cjs --check
          node repo/scripts/audit-fallback-risk.cjs
          node repo/scripts/validate-toolkit.cjs
          node repo/scripts/audit-skill-portability.cjs
          node repo/scripts/run-design-tests.cjs
          node repo/scripts/generate-n8n-stack-launcher-flow.cjs --check
          node repo/scripts/check-diff-whitespace.cjs
          node repo/scripts/check-test-durations.cjs --ci
          node repo/scripts/run-tests.cjs --verify-ci "$RUNNER_TEMP/test-summaries"
