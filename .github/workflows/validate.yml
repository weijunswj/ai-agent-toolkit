name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit per-commit module version history
        env:
          VERSION_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSION_AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node repo/scripts/audit-commit-version-history.cjs --base "$VERSION_AUDIT_BASE" --head "$VERSION_AUDIT_HEAD"

      - name: Run validation
        run: |
          node repo/scripts/sync-repo-doc-contract.cjs --check
          node repo/scripts/sync-toolkit-projects.cjs --check
          node repo/scripts/audit-project-source-locks.cjs
          node repo/scripts/audit-published-surfaces.cjs --check
          node repo/scripts/audit-fallback-risk.cjs
          node repo/scripts/validate-toolkit.cjs
          node --test repo/tests/*.test.cjs
          node repo/scripts/package-skills.cjs --check
          node repo/scripts/audit-skill-portability.cjs
          node repo/scripts/package-packs.cjs --check
          node repo/scripts/run-design-tests.cjs
          git diff --check
