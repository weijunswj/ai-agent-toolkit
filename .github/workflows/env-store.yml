name: Env store

# The toolkit env store tests on Windows, which the Validate job does not cover: the real Windows
# Credential Manager, with dummy values under a test-only prefix. Linux runs these tests inside
# Validate.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  env-store:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run env store tests
        run: node --test repo/tests/toolkit-env-store.test.cjs repo/tests/toolkit-env.test.cjs
