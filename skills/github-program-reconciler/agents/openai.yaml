interface:
  display_name: GitHub Program Reconciler
  short_description: Keep programme state documents and GitHub links in step.
  primary_color: '#1D4ED8'
  default_prompt: If the repository has .github/toolkit-programme.json, use $github-program-reconciler at significant events (task added, changed or deleted; merge; PR opened or head moved; issue closed or reopened; reorder; release; controller change) to dry-run reconcile and apply within the fences; without the binding do nothing; never close, delete or merge.
policy:
  products:
    - chatgpt
    - codex
    - api
    - atlas
  allow_implicit_invocation: true
