interface:
  display_name: GitHub Program Reconciler
  short_description: Keep programme state documents and GitHub links in step.
  primary_color: '#1D4ED8'
  default_prompt: If the repository has .github/toolkit-programme.json, use $github-program-reconciler at big moments: the programme file is added, a child issue changes, a pull request opens, moves or merges, an issue closes or reopens, the order changes, a release ships or the controller changes. Any session may run the preview (dry run) and report it. Only the appointed controller writes programme state: it holds the parent document and runs every writing command itself, including handing out work, returns, user testing, review and completion. A planning, build or review session it assigns (G0, G1 or G2) writes only its own checkpoint journal; helpers never write. Every programme.cjs command refuses without the programme file; the file does not change governed issue records. Never close, delete or merge.
policy:
  products:
    - chatgpt
    - codex
    - atlas
  allow_implicit_invocation: true
