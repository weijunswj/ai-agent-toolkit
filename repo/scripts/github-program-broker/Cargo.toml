[package]
name = "github-program-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "UNLICENSED"
publish = false

[lib]
name = "github_program_broker"
path = "src/lib.rs"

[[bin]]
name = "github-program-broker"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hmac = "=0.13.0"
sha2 = "=0.11.0"
getrandom = "=0.4.3"
zeroize = { version = "=1.9.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
